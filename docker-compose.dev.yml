# ============================================================
#  Fortunas AI — docker-compose.dev.yml
#  Development mode: hot-reload backend + Vite dev server for the React
#  frontend (the production client — ADR-0002).
#
#  Usage:
#    docker compose -f docker-compose.dev.yml up --build
#
#  Differences from production (docker-compose.yml):
#    - Backend: source code mounted (--reload enabled)
#    - Frontend: Vite dev server (not nginx) with HMR
#    - Backend port 8000 is exposed directly (production now does this too —
#      see the CORS_ORIGINS note below in both files)
# ============================================================

services:

  # ── ARSIP — tidak dipakai produksi ────────────────────────────────
  # LLM aktif = Gemini 2.5 Flash via API (lihat app/llm_provider.py).
  # Blok ini SENGAJA dipertahankan sebagai jejak migrasi: arsitektur LLM
  # lokal ini pernah benar-benar dibangun dan masih dirujuk novelty #2 di
  # proposal hibah. `profiles` membuatnya tidak ikut `docker compose up`,
  # jadi tidak ada yang tanpa sengaja mengunduh model 4-5 GB untuk sesuatu
  # yang tidak pernah dipanggil.
  # Menjalankannya dengan sengaja:
  #   docker compose -f docker-compose.dev.yml --profile archive up ollama
  #   make pull-model
  #   LLM_PROVIDER=ollama uvicorn app.main:app
  ollama:
    profiles: ["archive"]
    image: ollama/ollama:latest
    container_name: fortunas_ollama_dev
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fortunas_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fortunas_backend_dev
    restart: unless-stopped
    env_file: .env
    environment:
      # OLLAMA_BASE_URL: hanya terbaca kalau LLM_PROVIDER=ollama dipilih sengaja
      # (service ollama di atas ada di profile "archive", tidak jalan default).
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_DB_PATH: /data/chroma_db
      DAILY_REPORT_PATH: /data/reports/daily_reports.json
      KNOWLEDGE_DOCS_DIR: /app/app/knowledge/umkm_docs
      # CORS_ORIGINS is for callers hitting :8000 *directly* from a different
      # origin — e.g. a Vite dev server run outside compose, or Swagger UI.
      # The frontend service below proxies /api through its own Vite dev
      # server (same-origin from the browser's point of view), so it doesn't
      # need an entry here. Replace these placeholder localhost origins with
      # wherever you're actually serving the client from.
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
    volumes:
      - ./app:/app/app                          # ← hot reload source
      - chroma_data:/data/chroma_db
      - reports_data:/data/reports
      - ./credentials:/app/credentials:ro
    ports:
      - "8000:8000"                             # exposed for direct Swagger access
    networks:
      - fortunas_net
    # Override entrypoint to enable --reload
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level debug

  # ── Frontend (Vite dev server, production React client — ADR-0002) ──
  frontend:
    image: node:22-alpine
    container_name: fortunas_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app                         # ← live Vite HMR
      - /app/node_modules                       # anonymous volume (avoid overwriting)
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - fortunas_net

volumes:
  ollama_data:
  chroma_data:
  reports_data:

networks:
  fortunas_net:
    driver: bridge
