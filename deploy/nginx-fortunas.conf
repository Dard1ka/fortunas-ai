# nginx untuk Fortunas AI — PWA (React + Vite, `frontend/`) + API same-origin.
#
# Kenapa same-origin: PWA disajikan di `/`, API di-proxy di `/api/`. Trailing
# slash pada proxy_pass memotong prefiks `/api`, jadi backend TIDAK diubah
# sama sekali. Akibatnya CORS tidak dibutuhkan dan mixed-content mustahil.
#
# ⛔ HTTPS WAJIB, bukan opsional. Service worker, prompt install, DAN
# getUserMedia (mikrofon → fitur voice) semuanya dikunci browser di balik
# secure context. Di HTTP polos fitur voice MATI.
#
# Pasang di: /etc/nginx/sites-available/fortunas → symlink ke sites-enabled/
# Deploy PWA: cd frontend && npm ci && npm run build,
#             lalu rsync isi frontend/dist/ → /var/www/fortunas/ (dari root repo)
#
# ⚠ Cek pasca-build WAJIB: `grep -R "fonts.googleapis" frontend/dist/` harus
# KOSONG. Font di-self-host (subset woff2 ber-hash di dist/assets/) — kalau
# grep menemukan sesuatu, ada regresi yang mengirim IP setiap UMKM ke Google
# di tiap load (bersinggungan dengan narasi UU PDP) dan cold load offline
# tidak bisa boot. Lihat DEPLOY.md § "Build & unggah PWA".
#
# Catatan bootstrap sertifikat pertama kali: server block 443 di bawah
# mengacu ke path sertifikat Let's Encrypt yang BELUM ada sebelum certbot
# pernah jalan. `nginx -t` / reload akan GAGAL ("cannot load certificate")
# kalau file ini di-aktifkan sebelum sertifikat pernah diterbitkan. Lihat
# DEPLOY.md § "Deploy PWA" → jalankan certbot dulu (fallback:
# `certbot certonly --standalone` kalau nginx sampai tidak bisa reload sama
# sekali), baru muat ulang nginx dengan file ini.

server {
    listen 80;
    server_name FORTUNAS_DOMAIN;   # mis. app.fortunas.id

    # Catatan: dua alur certbot yang didokumentasikan di DEPLOY.md
    # (`--nginx` plugin, dan fallback `certonly --standalone`) TIDAK
    # memakai webroot ini — keduanya menangani tantangan HTTP-01 dengan
    # cara lain (edit config sementara / nginx dimatikan sebentar). Blok
    # di bawah sengaja dibiarkan sebagai jalur murah kalau suatu saat tim
    # pindah ke certbot webroot mode
    # (`certbot certonly --webroot -w /var/www/certbot -d <domain>`),
    # yang tidak perlu stop nginx maupun mengedit config lewat plugin.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name FORTUNAS_DOMAIN;

    # Diisi/diperbarui otomatis oleh: certbot --nginx (lihat DEPLOY.md)
    ssl_certificate     /etc/letsencrypt/live/FORTUNAS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FORTUNAS_DOMAIN/privkey.pem;

    # HSTS. Murah karena HTTPS memang sudah WAJIB di produk ini (tanpa secure
    # context: service worker, prompt install, dan getUserMedia mati) — jadi
    # tidak ada mode HTTP yang sengaja dipakai dan bisa dirusak baris ini.
    # 15768000 detik = 6 bulan. TANPA includeSubDomains: `app.` berbagi induk
    # `fortunas.id` dengan landing cPanel yang bukan urusan config ini.
    #
    # ⚠ JEBAKAN nginx: `add_header` HANYA diwarisi ke level di bawahnya kalau
    # level itu TIDAK punya `add_header` sendiri sama sekali. Semua `location`
    # yang menyetel Cache-Control di bawah karena itu MENGULANG baris HSTS ini
    # — kalau tidak, `location = /index.html` (dokumen utamanya!) justru jadi
    # satu-satunya respons yang kehilangan HSTS.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Upload Excel bisa besar
    client_max_body_size 25m;

    # ── Kompresi ────────────────────────────────────────────────
    # Entry JS ~93 KB gzip dari ~330 KB mentah; gzip membantu di koneksi
    # lambat. Juga otomatis berlaku ke respons JSON /api/ (bonus).
    # Font woff/woff2 TIDAK masuk daftar: formatnya sudah terkompresi,
    # gzip ulang cuma buang CPU.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── PWA statis ────────────────────────────────────────────
    # ⚠ Docroot ini SATU ORIGIN dengan API, dan token JWT UMKM hidup di
    # `localStorage` origin ini. Apa pun yang disajikan dari sini mewarisi hak
    # baca token itu — jadi JANGAN pernah menaruh halaman statis lain, HTML
    # hasil upload, atau autoindex di sini. Isinya HANYA hasil
    # `npm run build` (frontend/dist/). Lihat DEPLOY.md § "Build & unggah PWA".
    root /var/www/fortunas;
    index index.html;

    # ── Rantai boot TIDAK boleh di-cache lama ─────────────────
    #
    # Vite MENG-HASH nama semua aset di `dist/assets/` (immutable aman, blok
    # di bawah), tapi EMPAT file rantai boot ini namanya STABIL di setiap
    # build — di-cache panjang = pengguna terkunci di build lama:
    #   index.html            → dokumen; referensi entry JS/CSS ber-hash
    #   manifest.webmanifest  → identitas install PWA (BUKAN manifest.json!)
    #   sw.js                 → service worker (precache manifest per-build)
    #   registerSW.js         → skrip kecil pendaftar SW, dimuat index.html
    # `no-cache` berarti REVALIDASI, bukan unduh ulang — nginx mengirim
    # ETag/Last-Modified, build yang tak berubah dijawab 304 (satu RTT).
    # Browser dengan SW aktif TOH memeriksa byte sw.js tiap navigasi
    # (registerType autoUpdate); aturan ini memastikan HTTP cache tidak
    # menyabotase pemeriksaan itu.
    #
    # `location =` (exact match) punya prioritas TERTINGGI di nginx dan
    # menghentikan pencarian location SEBELUM regex di bawah dievaluasi — jadi
    # blok-blok ini tidak akan pernah "ketiban" cache panjang oleh regex aset di
    # bawahnya, berapa pun urutan barisnya di file ini.
    #
    # Baris HSTS diulang di setiap blok: lihat jebakan pewarisan `add_header`
    # di komentar HSTS server-level di atas.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }
    location = /manifest.webmanifest {
        # mime.types distro belum tentu memetakan .webmanifest
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }

    # ── Swagger/OpenAPI TIDAK dipublikasikan ──────────────────
    # `app/main.py` membangun `FastAPI(...)` tanpa `docs_url=None`, jadi
    # `/docs`, `/redoc`, dan `/openapi.json` semuanya hidup di backend — dan
    # `location /api/` di bawah mem-proxy semuanya. Dibendung di nginx supaya
    # backend tidak perlu diubah sama sekali (prinsip yang sama dengan strip
    # prefiks). `location =` → prioritas tertinggi, tidak bergantung urutan.
    # Docs tetap tersedia dari dalam VPS: `curl http://127.0.0.1:8000/docs`.
    location = /api/docs         { return 404; }
    location = /api/redoc        { return 404; }
    location = /api/openapi.json { return 404; }

    # ── Aset ber-hash Vite: immutable ─────────────────────────
    # Semua isi dist/assets/ bernama `<nama>-<hash>.<ext>` (JS, CSS, woff2…)
    # — konten berubah = nama berubah, jadi cache 1 tahun + immutable aman
    # dan justru menghapus seluruh kelas jebakan "cache menyajikan build lama"
    # era Flutter (yang tidak meng-hash nama file apa pun).
    #
    # `^~` WAJIB, bukan gaya penulisan (jebakan yang sama dengan /media/ di
    # bawah): urutan pencocokan nginx = exact `=` → prefix `^~` → REGEX →
    # prefix biasa. Tanpa `^~`, regex ekstensi di bawah menang untuk
    # `/assets/index-*.js` dan header immutable tidak pernah terpasang.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15768000" always;
        try_files $uri =404;
    }

    # Runtime workbox: satu-satunya file ber-hash yang ditulis vite-plugin-pwa
    # di ROOT dist (mis. workbox-9c191d2f.js), bukan di /assets/. Ditaruh
    # SEBELUM regex ekstensi umum — antar-regex, match PERTAMA menang.
    location ~ ^/workbox-.+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15768000" always;
        try_files $uri =404;
    }

    # File public/ tak ber-hash di root (favicon.svg, icons.svg, logo*.png…):
    # nama stabil antar build → JANGAN immutable. 1 jam = paling buruk satu
    # conditional request per aset per jam, dijawab 304 kalau tidak berubah.
    #
    # try_files ...=404 supaya aset yang hilang balas 404, bukan diam-diam
    # jatuh ke index.html (yang bikin browser gagal parse HTML sebagai JS/CSS).
    location ~* \.(?:js|css|ttf|otf|woff|woff2|png|jpg|jpeg|gif|webp|ico|svg|json|txt)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=15768000" always;
        try_files $uri =404;
    }

    # React Router memakai PATH RIIL (/briefing, /checkout, /customer/qr…),
    # BUKAN hash `#/` seperti Flutter dulu — fallback SPA ini benar-benar
    # dipakai setiap kali pengguna refresh/deep-link di rute mana pun.
    location / { try_files $uri $uri/ /index.html; }

    # ── API ───────────────────────────────────────────────────
    # Trailing slash memotong prefiks /api → backend tetap di root-nya.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM (Gemini) bisa beberapa detik
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Streaming briefing (SSE) — matikan buffering
        proxy_buffering off;
    }

    # ── Gambar produk ─────────────────────────────────────────
    # TANPA trailing slash pada proxy_pass: backend memang meng-serve
    # /media/products/... apa adanya, dan image_url yang disimpan berupa path itu.
    #
    # `^~` WAJIB, bukan gaya penulisan. Urutan pencocokan nginx adalah:
    # exact `=` → prefix `^~` → REGEX → prefix biasa. Blok regex aset di atas
    # menangkap `png|jpg|jpeg|webp`, dan `app/product_repo.py:56` membuat SETIAP
    # image_url berbentuk `/media/products/{tenant}/{hex}.{jpg|jpeg|png|webp}`.
    # Tanpa `^~`, regex itu menang atas prefix biasa dan setiap gambar produk
    # dijawab `try_files =404` dari docroot statis — tidak pernah sampai ke
    # backend. `^~` menghentikan evaluasi regex begitu prefix ini cocok.
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
