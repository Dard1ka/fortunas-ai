# nginx untuk Fortunas AI — PWA (Flutter web) + API same-origin.
#
# Kenapa same-origin: PWA disajikan di `/`, API di-proxy di `/api/`. Trailing
# slash pada proxy_pass memotong prefiks `/api`, jadi backend TIDAK diubah
# sama sekali. Akibatnya CORS tidak dibutuhkan dan mixed-content mustahil.
#
# ⛔ HTTPS WAJIB, bukan opsional. Service worker, prompt install, DAN
# getUserMedia (mikrofon → fitur voice) semuanya dikunci browser di balik
# secure context. Di HTTP polos fitur voice MATI.
#
# Pasang di: /etc/nginx/sites-available/fortunas → symlink ke sites-enabled/
# Deploy PWA: flutter build web --release --no-web-resources-cdn
#             && rsync mobile/build/web/ → /var/www/fortunas/
#
# ⚠ `--no-web-resources-cdn` BUKAN opsional. Tanpa flag itu loader mengambil
# CanvasKit dari https://www.gstatic.com/flutter-canvaskit/<engineRevision>/,
# sehingga: (a) cold load offline TIDAK bisa boot (service worker hanya
# meng-cache resource same-origin), (b) ada script pihak ketiga yang disuntik
# saat runtime meski `index.html` sendiri bersih, dan (c) IP setiap UMKM ikut
# terkirim ke Google di tiap cold load. Lihat DEPLOY.md § "Build & unggah PWA".
#
# Catatan bootstrap sertifikat pertama kali: server block 443 di bawah
# mengacu ke path sertifikat Let's Encrypt yang BELUM ada sebelum certbot
# pernah jalan. `nginx -t` / reload akan GAGAL ("cannot load certificate")
# kalau file ini di-aktifkan sebelum sertifikat pernah diterbitkan. Lihat
# DEPLOY.md § "Deploy PWA" → jalankan certbot dulu (fallback:
# `certbot certonly --standalone` kalau nginx sampai tidak bisa reload sama
# sekali), baru muat ulang nginx dengan file ini.

server {
    listen 80;
    server_name FORTUNAS_DOMAIN;   # mis. fortunas.duckdns.org

    # Catatan: dua alur certbot yang didokumentasikan di DEPLOY.md
    # (`--nginx` plugin, dan fallback `certonly --standalone`) TIDAK
    # memakai webroot ini — keduanya menangani tantangan HTTP-01 dengan
    # cara lain (edit config sementara / nginx dimatikan sebentar). Blok
    # di bawah sengaja dibiarkan sebagai jalur murah kalau suatu saat tim
    # pindah ke certbot webroot mode
    # (`certbot certonly --webroot -w /var/www/certbot -d <domain>`),
    # yang tidak perlu stop nginx maupun mengedit config lewat plugin.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name FORTUNAS_DOMAIN;

    # Diisi/diperbarui otomatis oleh: certbot --nginx (lihat DEPLOY.md)
    ssl_certificate     /etc/letsencrypt/live/FORTUNAS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FORTUNAS_DOMAIN/privkey.pem;

    # HSTS. Murah karena HTTPS memang sudah WAJIB di produk ini (tanpa secure
    # context: service worker, prompt install, dan getUserMedia mati) — jadi
    # tidak ada mode HTTP yang sengaja dipakai dan bisa dirusak baris ini.
    # 15768000 detik = 6 bulan. TANPA includeSubDomains: kalau tim pakai
    # DuckDNS, domainnya berbagi induk dengan pengguna lain.
    #
    # ⚠ JEBAKAN nginx: `add_header` HANYA diwarisi ke level di bawahnya kalau
    # level itu TIDAK punya `add_header` sendiri sama sekali. Semua `location`
    # yang menyetel Cache-Control di bawah karena itu MENGULANG baris HSTS ini
    # — kalau tidak, `location = /index.html` (dokumen utamanya!) justru jadi
    # satu-satunya respons yang kehilangan HSTS.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Upload Excel bisa besar
    client_max_body_size 25m;

    # ── Kompresi ────────────────────────────────────────────────
    # main.dart.js + canvaskit .wasm bisa beberapa MB; gzip membantu di
    # koneksi lambat. Juga otomatis berlaku ke respons JSON /api/ (bonus).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    # ── PWA statis ────────────────────────────────────────────
    # ⚠ Docroot ini SATU ORIGIN dengan API, dan token JWT UMKM hidup di
    # `localStorage` origin ini. Apa pun yang disajikan dari sini mewarisi hak
    # baca token itu — jadi JANGAN pernah menaruh halaman statis lain, HTML
    # hasil upload, atau autoindex di sini. Isinya HANYA hasil
    # `flutter build web`. Lihat DEPLOY.md § "Build & unggah PWA".
    root /var/www/fortunas;
    index index.html;

    # ── Rantai boot TIDAK boleh di-cache lama ─────────────────
    #
    # ⚠ **Flutter web tidak meng-hash NAMA file apa pun.** `main.dart.js`,
    # `flutter_bootstrap.js`, `flutter.js`, `flutter_service_worker.js`, dan
    # semua `assets/*` memakai nama yang PERSIS SAMA di setiap build. Jadi
    # "aset ber-hash aman di-cache panjang" — argumen klasik untuk `expires
    # 30d` — TIDAK berlaku di sini sama sekali. Kalau sebuah nama di-cache
    # panjang, isinya yang basi ikut awet, tanpa cara apa pun bagi browser
    # untuk tahu ada versi baru.
    #
    # `flutter_bootstrap.js` yang paling berbahaya: ia diakhiri
    # `serviceWorkerVersion: "<angka per-build>"` dan dimuat dari `index.html`
    # TANPA cache-buster. Bootstrap basi → versi service worker basi → update
    # tidak pernah terlihat, walau `index.html`-nya sendiri sudah segar.
    #
    # `main.dart.js` mendapat perlakuan sama (bukan `expires` pendek) atas tiga
    # alasan: (1) namanya stabil, jadi salinan basi = UMKM diam-diam menjalankan
    # kode aplikasi LAMA; (2) `no-cache` berarti REVALIDASI, bukan unduh ulang —
    # nginx mengirim ETag + Last-Modified untuk file statis, jadi build yang tak
    # berubah dijawab `304` (satu RTT), bukan ~0,9 MB gzip; (3) klien yang sudah
    # punya service worker aktif TOH sudah melewati HTTP cache untuk file ini
    # (`flutter_service_worker.js` memuat CORE = main.dart.js + index.html +
    # flutter_bootstrap.js + AssetManifest + FontManifest dengan
    # `new Request(v, {'cache': 'reload'})`), jadi aturan ini hanya mengubah
    # perilaku untuk klien TANPA service worker aktif — justru populasi yang
    # tadinya bisa tertinggal sampai sebulan.
    #
    # `location =` (exact match) punya prioritas TERTINGGI di nginx dan
    # menghentikan pencarian location SEBELUM regex di bawah dievaluasi — jadi
    # blok-blok ini tidak akan pernah "ketiban" cache panjang oleh regex aset di
    # bawahnya, berapa pun urutan barisnya di file ini.
    #
    # Baris HSTS diulang di setiap blok: lihat jebakan pewarisan `add_header`
    # di komentar HSTS server-level di atas.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
    }

    # ── Swagger/OpenAPI TIDAK dipublikasikan ──────────────────
    # `app/main.py` membangun `FastAPI(...)` tanpa `docs_url=None`, jadi
    # `/docs`, `/redoc`, dan `/openapi.json` semuanya hidup di backend — dan
    # `location /api/` di bawah mem-proxy semuanya. Dibendung di nginx supaya
    # backend tidak perlu diubah sama sekali (prinsip yang sama dengan strip
    # prefiks). `location =` → prioritas tertinggi, tidak bergantung urutan.
    #
    # Catatan: `/api/openapi.json` hari ini KEBETULAN sudah 404 karena berakhiran
    # `.json` sehingga tertangkap regex aset di bawah (`try_files $uri =404`)
    # sebelum sampai ke proxy. Jangan bersandar pada kecelakaan itu — regex bisa
    # berubah, dan `/api/docs` tidak punya ekstensi apa pun sehingga TIDAK
    # tertangkap: tanpa blok di bawah, halaman Swagger UI benar-benar tersaji ke
    # publik. Docs tetap tersedia dari dalam VPS: `curl http://127.0.0.1:8000/docs`.
    location = /api/docs         { return 404; }
    location = /api/redoc        { return 404; }
    location = /api/openapi.json { return 404; }

    # .wasm dipisah & ditaruh SEBELUM regex aset umum (urutan regex penting,
    # match pertama menang): banyak paket nginx distro (termasuk nginx
    # bawaan Ubuntu 22.04/24.04) belum memetakan .wasm ke application/wasm
    # di mime.types bawaan — tanpa default_type ini browser Chrome/Firefox
    # bisa menolak streaming-compile canvaskit.wasm.
    #
    # Blok ini BERGUNA sejak build dipindah ke `--no-web-resources-cdn`: kini
    # `canvaskit/*.wasm` benar-benar diminta dari origin ini. Sebelumnya loader
    # mengambil CanvasKit dari gstatic.com dan tidak ada satu pun `.wasm` yang
    # pernah diminta ke sini, sehingga blok ini mati (lihat DEPLOY.md § Build).
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 1h;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=15768000" always;
        try_files $uri =404;
    }

    # Aset sisanya (font, ikon, AssetManifest, canvaskit.js, flutter.js…).
    # `expires 1h`, BUKAN 30d: sama seperti rantai boot di atas, tidak satu pun
    # nama di sini ber-hash. Font `assets/assets/fonts/Inter.ttf` misalnya
    # berubah isi biner saat disubset tapi namanya tetap — salinan 30 hari yang
    # basi berarti glyph hilang di layar UMKM, dan service worker TIDAK
    # menyelamatkannya: entri non-CORE diambil lewat `fetch` biasa yang
    # melewati HTTP cache, jadi salinan basi itu malah ikut dibakukan ke Cache
    # API. 1 jam = paling buruk satu conditional request per aset per jam,
    # dijawab `304` kalau tidak berubah.
    #
    # try_files ...=404 supaya aset yang hilang balas 404, bukan diam-diam jatuh
    # ke index.html (yang akan bikin browser gagal parse HTML sebagai JS/CSS).
    location ~* \.(?:js|ttf|otf|woff|woff2|png|jpg|jpeg|gif|webp|ico|svg|json)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=15768000" always;
        try_files $uri =404;
    }

    # Flutter web memakai hash routing (#/login), jadi server hanya pernah
    # melihat `/`. try_files tetap dipasang untuk jaga-jaga.
    location / { try_files $uri $uri/ /index.html; }

    # ── API ───────────────────────────────────────────────────
    # Trailing slash memotong prefiks /api → backend tetap di root-nya.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM (Gemini) bisa beberapa detik
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Streaming briefing (SSE) — matikan buffering
        proxy_buffering off;
    }

    # ── Gambar produk ─────────────────────────────────────────
    # TANPA trailing slash: backend memang meng-serve /media/products/... apa
    # adanya, dan image_url yang disimpan berupa path itu.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
