# nginx untuk Fortunas AI — PWA (Flutter web) + API same-origin.
#
# Kenapa same-origin: PWA disajikan di `/`, API di-proxy di `/api/`. Trailing
# slash pada proxy_pass memotong prefiks `/api`, jadi backend TIDAK diubah
# sama sekali. Akibatnya CORS tidak dibutuhkan dan mixed-content mustahil.
#
# ⛔ HTTPS WAJIB, bukan opsional. Service worker, prompt install, DAN
# getUserMedia (mikrofon → fitur voice) semuanya dikunci browser di balik
# secure context. Di HTTP polos fitur voice MATI.
#
# Pasang di: /etc/nginx/sites-available/fortunas → symlink ke sites-enabled/
# Deploy PWA: flutter build web --release && rsync mobile/build/web/ → /var/www/fortunas/
#
# Catatan bootstrap sertifikat pertama kali: server block 443 di bawah
# mengacu ke path sertifikat Let's Encrypt yang BELUM ada sebelum certbot
# pernah jalan. `nginx -t` / reload akan GAGAL ("cannot load certificate")
# kalau file ini di-aktifkan sebelum sertifikat pernah diterbitkan. Lihat
# DEPLOY.md § "Deploy PWA" → jalankan certbot dulu (fallback:
# `certbot certonly --standalone` kalau nginx sampai tidak bisa reload sama
# sekali), baru muat ulang nginx dengan file ini.

server {
    listen 80;
    server_name FORTUNAS_DOMAIN;   # mis. fortunas.duckdns.org

    # Biarkan certbot menyelesaikan tantangan HTTP-01, sisanya paksa HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name FORTUNAS_DOMAIN;

    # Diisi/diperbarui otomatis oleh: certbot --nginx (lihat DEPLOY.md)
    ssl_certificate     /etc/letsencrypt/live/FORTUNAS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FORTUNAS_DOMAIN/privkey.pem;

    # Upload Excel bisa besar
    client_max_body_size 25m;

    # ── Kompresi ────────────────────────────────────────────────
    # main.dart.js + canvaskit .wasm bisa beberapa MB; gzip membantu di
    # koneksi lambat. Juga otomatis berlaku ke respons JSON /api/ (bonus).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    # ── PWA statis ────────────────────────────────────────────
    root /var/www/fortunas;
    index index.html;

    # Service worker & manifest TIDAK boleh di-cache lama: kalau tidak,
    # update aplikasi tidak pernah sampai ke UMKM. `location =` (exact
    # match) punya prioritas TERTINGGI di nginx dan menghentikan pencarian
    # location SEBELUM regex di bawah dievaluasi — jadi 3 blok ini tidak
    # akan pernah "ketiban" cache panjang oleh regex aset di bawahnya,
    # berapa pun urutan barisnya di file ini.
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json             { add_header Cache-Control "no-cache"; }
    location = /index.html                { add_header Cache-Control "no-cache"; }

    # .wasm dipisah & ditaruh SEBELUM regex aset umum (urutan regex penting,
    # match pertama menang): banyak paket nginx distro (termasuk nginx
    # bawaan Ubuntu 22.04/24.04) belum memetakan .wasm ke application/wasm
    # di mime.types bawaan — tanpa default_type ini browser Chrome/Firefox
    # bisa menolak streaming-compile canvaskit.wasm.
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Aset ber-hash lain aman di-cache panjang. try_files ...=404 supaya
    # aset yang hilang balas 404, bukan diam-diam jatuh ke index.html
    # (yang akan bikin browser gagal parse HTML sebagai JS/CSS).
    location ~* \.(?:js|ttf|otf|woff|woff2|png|jpg|jpeg|gif|webp|ico|svg|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Flutter web memakai hash routing (#/login), jadi server hanya pernah
    # melihat `/`. try_files tetap dipasang untuk jaga-jaga.
    location / { try_files $uri $uri/ /index.html; }

    # ── API ───────────────────────────────────────────────────
    # Trailing slash memotong prefiks /api → backend tetap di root-nya.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM (Gemini) bisa beberapa detik
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Streaming briefing (SSE) — matikan buffering
        proxy_buffering off;
    }

    # ── Gambar produk ─────────────────────────────────────────
    # TANPA trailing slash: backend memang meng-serve /media/products/... apa
    # adanya, dan image_url yang disimpan berupa path itu.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
