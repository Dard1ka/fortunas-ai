name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deps minimal — cukup untuk lint + smoke test kontrak (schemas).
      # JANGAN install requirements.txt penuh (torch/chromadb) di smoke ini.
      # Tambah dep di sini saat ada test yang butuh modul app lebih berat.
      - name: Install deps
        run: pip install ruff==0.15.10 pytest==9.0.2 pydantic==2.12.5 SQLAlchemy==2.0.46 fastapi==0.135.3 httpx==0.28.1 bcrypt==5.0.0 PyJWT==2.10.1 python-dotenv==1.2.2 python-multipart==0.0.20
      - name: Lint (ruff)
        run: ruff check app tests --extend-exclude=app/migrations
      - name: Test (pytest smoke)
        run: python -m pytest tests/ -v

  # Klien produksi React (ADR-0002). Nama job ini akan menjadi required check
  # di Gate D — ⚠️ JANGAN GANTI STRING `name:` INI (aturan yang sama dengan
  # job mobile di bawah).
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest, aktif setelah Spec 2)
        run: npm test --if-present
      # WAJIB byte-identik dengan perintah build di deploy/DEPLOY.md (kanal
      # rilis) — gate CI harus mem-build persis artefak yang dideploy.
      - name: Build (vite)
        run: npm run build

  mobile:
    # ⚠️ JANGAN GANTI STRING `name:` INI (dulu). STATUS: STUB GATE D.
    #
    # `mobile/` (Flutter) sudah DIHAPUS di Gate D (ADR-0002) — klien produksi
    # adalah React `frontend/`. Job ini sengaja disisakan sebagai STUB bernama
    # sama karena branch protection `main` masih mencantumkan
    # `Mobile (flutter analyze)` sebagai required check yang dicocokkan
    # berdasarkan NAMA JOB secara harfiah; menghapusnya sebelum setelan
    # diubah membuat SEMUA PR macet `blocked` menunggu check yang tidak akan
    # pernah dilaporkan (insiden PR #26).
    #
    # LANGKAH PENUTUP (butuh hak admin repo — Dard1ka):
    # Settings → Branches → required status checks: hapus
    # `Mobile (flutter analyze)`, tambahkan `Frontend (lint + test + build)`;
    # lalu hapus seluruh job stub ini DALAM PR YANG SAMA.
    name: Mobile (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - name: Stub Gate D
        run: echo "mobile/ (Flutter) dihapus di Gate D (ADR-0002). Job ini stub agar required check tetap terlapor sampai admin menukar setelan branch protection."
