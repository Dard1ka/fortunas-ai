name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deps minimal — cukup untuk lint + smoke test kontrak (schemas).
      # JANGAN install requirements.txt penuh (torch/chromadb) di smoke ini.
      # Tambah dep di sini saat ada test yang butuh modul app lebih berat.
      - name: Install deps
        run: pip install ruff==0.15.10 pytest==9.0.2 pydantic==2.12.5 SQLAlchemy==2.0.46 fastapi==0.135.3 httpx==0.28.1 bcrypt==5.0.0 PyJWT==2.10.1 python-dotenv==1.2.2 python-multipart==0.0.20
      - name: Lint (ruff)
        run: ruff check app tests --extend-exclude=app/migrations
      - name: Test (pytest smoke)
        run: python -m pytest tests/ -v

  # Klien produksi React (ADR-0002). Nama job ini akan menjadi required check
  # di Gate D — ⚠️ JANGAN GANTI STRING `name:` INI (aturan yang sama dengan
  # job mobile di bawah).
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest, aktif setelah Spec 2)
        run: npm test --if-present
      # WAJIB byte-identik dengan perintah build di deploy/DEPLOY.md (kanal
      # rilis) — gate CI harus mem-build persis artefak yang dideploy.
      - name: Build (vite)
        run: npm run build

  mobile:
    # ⚠️ JANGAN GANTI STRING `name:` INI.
    # Proteksi branch `main` mencocokkan required status check berdasarkan NAMA
    # JOB secara harfiah. Mengubahnya membuat GitHub menunggu selamanya sebuah
    # check yang tidak akan pernah dilaporkan, dan PR macet di `blocked` —
    # bukan `dirty`, jadi tidak terlihat seperti masalah CI dan mudah salah
    # didiagnosis. Sudah pernah terjadi: PR #26 sempat macet karena job ini
    # di-rename, sementara `Backend (ruff + pytest)` lolos.
    # Kalau nama ini memang mau diperbarui, ubah setelan required status check
    # di Settings → Branches DALAM PERUBAHAN YANG SAMA (butuh hak admin repo).
    # Isi job-nya kini: analyze + test + build web (lihat langkah-langkah di bawah).
    name: Mobile (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.7"
          channel: stable
          cache: true
      - name: Flutter deps
        run: flutter pub get
        working-directory: mobile
      # --no-fatal-infos: gagal hanya pada error/warning, bukan info gaya.
      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: mobile
      - name: Test
        run: flutter test
        working-directory: mobile
      # Kanal rilis = PWA. Tanpa gate ini, regresi khusus web (mis. plugin
      # yang tidak mendukung web) lolos diam-diam sampai deploy.
      #
      # --no-web-resources-cdn: WAJIB, dan harus sama dengan perintah build di
      # deploy/DEPLOY.md. Tanpa flag ini `flutter_bootstrap.js` memancarkan
      # buildConfig ber-`engineRevision` tanpa `useLocalCanvasKit`, sehingga
      # loader mengambil CanvasKit dari https://www.gstatic.com/flutter-canvaskit/
      # saat runtime. Akibatnya: cold load offline tidak bisa boot (service
      # worker hanya meng-cache same-origin), ada script pihak ketiga yang
      # disuntik meski index.html bersih, dan IP tiap UMKM terkirim ke Google.
      # Gate CI harus mem-build persis apa yang dideploy, kalau tidak gate ini
      # menghijaukan artefak yang berbeda dari yang dipakai produksi.
      - name: Build web (PWA release)
        run: flutter build web --release --no-web-resources-cdn
        working-directory: mobile
