# ============================================================
#  Fortunas AI — docker-compose.yml
#  Backend + archived React frontend. The shipped client is Flutter web
#  (PWA) and is NOT part of this compose file — see
#  deploy/nginx-fortunas.conf for the supported same-origin VPS deploy, or
#  run the PWA separately for local dev (`cd mobile && flutter run -d chrome`).
#
#  Services:
#    ollama    → local LLM server (Qwen3:8b) (ARSIP)
#    backend   → FastAPI + RAG pipeline, exposed on :8000
#    frontend  → nginx serving the archived React build (design reference
#                only — see frontend/README.md; not the shipped client)
#
#  Usage:
#    docker compose up --build          ← first time / after code change
#    docker compose up -d               ← background
#    docker compose logs -f backend     ← stream backend logs
#    docker compose down                ← stop all
#    docker compose down -v             ← stop + delete volumes
# ============================================================

services:

  # ── ARSIP — tidak dipakai produksi ────────────────────────────────
  # LLM aktif = Gemini 2.5 Flash via API (lihat app/llm_provider.py).
  # Blok ini SENGAJA dipertahankan sebagai jejak migrasi: arsitektur LLM
  # lokal ini pernah benar-benar dibangun dan masih dirujuk novelty #2 di
  # proposal hibah. `profiles` membuatnya tidak ikut `docker compose up`,
  # jadi tidak ada yang tanpa sengaja mengunduh model 4-5 GB untuk sesuatu
  # yang tidak pernah dipanggil.
  # Menjalankannya dengan sengaja:
  #   docker compose --profile archive up ollama
  #   make pull-model
  #   LLM_PROVIDER=ollama uvicorn app.main:app
  ollama:
    profiles: ["archive"]
    image: ollama/ollama:latest
    container_name: fortunas_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"           # expose for local debugging only
    volumes:
      - ollama_data:/root/.ollama   # persists downloaded models
    networks:
      - fortunas_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    # ── GPU support (uncomment if you have NVIDIA GPU) ────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fortunas_backend
    restart: unless-stopped
    env_file: .env                    # loads your .env file
    environment:
      # Override paths to use Docker volumes instead of local dirs
      # OLLAMA_BASE_URL: hanya terbaca kalau LLM_PROVIDER=ollama dipilih sengaja
      # (service ollama di atas ada di profile "archive", tidak jalan default).
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_DB_PATH: /data/chroma_db
      DAILY_REPORT_PATH: /data/reports/daily_reports.json
      KNOWLEDGE_DOCS_DIR: /app/app/knowledge/umkm_docs
      # CORS_ORIGINS is for callers hitting :8000 *directly* from a different
      # origin — the PWA (served separately, e.g. `flutter run -d chrome`'s
      # dev port) or Swagger UI. The frontend service below reaches backend
      # through its own nginx proxy (docker/frontend/nginx.conf, /api/* →
      # backend:8000) — that path is same-origin and CORS doesn't apply to
      # it. Replace these placeholder localhost origins with wherever you're
      # actually serving the PWA from.
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
    ports:
      - "8000:8000"           # exposed directly for the PWA and for direct
                               # API/Swagger access. Doesn't conflict with the
                               # frontend service below, which reaches backend
                               # over the internal network via its own nginx.
    volumes:
      - chroma_data:/data/chroma_db           # vector DB (persistent)
      - reports_data:/data/reports            # daily reports (persistent)
      - ./credentials:/app/credentials:ro    # GCP service account (read-only)
    networks:
      - fortunas_net

  # ── Frontend (nginx + archived React build) ─────────────────
  # Design reference only — not built/tested/CI-gated, not the shipped
  # client. See frontend/README.md.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: fortunas_frontend
    restart: unless-stopped
    ports:
      - "3000:80"               # access app at http://localhost:3000
    depends_on:
      - backend
    networks:
      - fortunas_net

# ── Named Volumes ──────────────────────────────────────────────
volumes:
  ollama_data:      # persists Ollama models (~4–5 GB for qwen3:8b)
  chroma_data:      # persists vector embeddings
  reports_data:     # persists daily briefing reports

# ── Internal Network ───────────────────────────────────────────
networks:
  fortunas_net:
    driver: bridge
