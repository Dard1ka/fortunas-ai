# ============================================================
#  Fortunas AI — docker-compose.yml
#  API-only stack (backend + Ollama). The PWA (Flutter web) is not part of
#  this compose file — see deploy/nginx-fortunas.conf for the supported
#  same-origin VPS deploy, or run the PWA separately for local dev.
#
#  Services:
#    ollama    → local LLM server (Qwen3:8b)
#    backend   → FastAPI + RAG pipeline, exposed on :8000
#
#  Usage:
#    docker compose up --build          ← first time / after code change
#    docker compose up -d               ← background
#    docker compose logs -f backend     ← stream backend logs
#    docker compose down                ← stop all
#    docker compose down -v             ← stop + delete volumes
# ============================================================

services:

  # ── Ollama (Local LLM) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: fortunas_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"           # expose for local debugging only
    volumes:
      - ollama_data:/root/.ollama   # persists downloaded models
    networks:
      - fortunas_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    # ── GPU support (uncomment if you have NVIDIA GPU) ────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fortunas_backend
    restart: unless-stopped
    env_file: .env                    # loads your .env file
    environment:
      # Override paths to use Docker volumes instead of local dirs
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_DB_PATH: /data/chroma_db
      DAILY_REPORT_PATH: /data/reports/daily_reports.json
      KNOWLEDGE_DOCS_DIR: /app/app/knowledge/umkm_docs
      # API-only stack now (the nginx frontend that used to proxy this is gone).
      # In the supported VPS deploy (deploy/nginx-fortunas.conf), the PWA and
      # API are served same-origin and CORS doesn't come into play at all. For
      # this compose stack, the PWA is served from wherever you run it
      # separately (e.g. `flutter run -d chrome`'s dev port) — replace these
      # placeholder localhost origins with that actual origin.
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
    ports:
      - "8000:8000"           # exposed directly: the nginx frontend that used to
                               # proxy this was removed (Task 1b). The PWA is served
                               # separately (VPS nginx, see deploy/nginx-fortunas.conf);
                               # this compose stack now serves the API only.
    volumes:
      - chroma_data:/data/chroma_db           # vector DB (persistent)
      - reports_data:/data/reports            # daily reports (persistent)
      - ./credentials:/app/credentials:ro    # GCP service account (read-only)
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - fortunas_net

# ── Named Volumes ──────────────────────────────────────────────
volumes:
  ollama_data:      # persists Ollama models (~4–5 GB for qwen3:8b)
  chroma_data:      # persists vector embeddings
  reports_data:     # persists daily briefing reports

# ── Internal Network ───────────────────────────────────────────
networks:
  fortunas_net:
    driver: bridge
